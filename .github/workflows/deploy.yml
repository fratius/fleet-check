# Deploys everything on every push to main, or by hand from the Actions tab (Run workflow).
#   backend: Firestore and Storage rules, and the AI functions (with the Anthropic key from GitHub secrets)
#   web:     the web app and the website (fratius.com) on Firebase Hosting
#   phone:   an update on the "main" channel that opens in Expo Go
#
# Secrets (Settings > Secrets and variables > Actions):
#   FIREBASE_SERVICE_ACCOUNT  JSON key of a service account with the Owner role on the Firebase project
#   ANTHROPIC_API_KEY         key from console.anthropic.com
#   EXPO_TOKEN                personal access token from expo.dev/settings/access-tokens
#   SMTP_URL                  optional: how the website's request form sends email to info@fratius.com,
#                             e.g. smtps://info%40fratius.com:APP-PASSWORD@smtp.gmail.com:465 (requests are stored either way)
# Variable (same page, Variables tab), optional:
#   APP_CREATOR_EMAILS        who gets the app creator view, comma separated (default casian.colto@gmail.com)
#   WEBSITE_SITE              the Firebase Hosting site for fratius.com (default fratius-web)
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  FIREBASE_TOOLS: firebase-tools@15.33.0

jobs:
  rules-test:
    name: Test the access rules
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --prefix tests
      - name: Run the rules tests on the Firestore emulator
        run: npx -y "$FIREBASE_TOOLS" emulators:exec --only firestore --project demo-fleet "npm --prefix tests test"

  history-test:
    name: Van history, end to end
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --prefix tests && npm ci --prefix functions && npm --prefix functions run build
      - name: Assignments, pick-up photos and history on the emulators (sign-in, rules, functions, storage)
        shell: bash
        run: |
          echo "ANTHROPIC_API_KEY=not-used-in-tests" > functions/.secret.local
          # A throwaway key pair for the notification test (the test reads it back to check the signature).
          echo "WEBPUSH_KEYS='$(node -e "process.stdout.write(JSON.stringify(require('./functions/node_modules/web-push').generateVAPIDKeys()))")'" >> functions/.secret.local
          echo "SMTP_URL=none" >> functions/.secret.local
          npx -y "$FIREBASE_TOOLS" emulators:exec --only auth,firestore,functions,storage --project demo-fleet-check "npm --prefix tests run history" 2>&1 | tee history.log
      - name: Show failures
        if: always()
        run: |
          grep -E "^not ok|# (pass|fail)" history.log | while read -r l; do echo "::notice title=History::$l"; done || true
          grep -E -A 14 "^\s*not ok" history.log | grep -E "error|Error|code|expected|actual|failureType|message|at " | head -30 | while read -r l; do echo "::notice title=History detail::$l"; done || true

  backend:
    name: Rules and AI functions
    needs: [rules-test, history-test]
    runs-on: ubuntu-24.04
    steps:
      - name: Check the secrets are there
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          ok=1
          [ -n "$SA" ] || { echo "::error title=Missing secret::Add FIREBASE_SERVICE_ACCOUNT under Settings > Secrets and variables > Actions. See README, step 2."; ok=0; }
          [ -n "$KEY" ] || { echo "::error title=Missing secret::Add ANTHROPIC_API_KEY under Settings > Secrets and variables > Actions. See README, step 3."; ok=0; }
          [ "$ok" = 1 ]
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v3
        id: auth
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install and build the functions
        run: npm ci --prefix functions && npm --prefix functions run build
      - name: Turn on the Google Cloud services the functions need
        env:
          PROJECT: ${{ steps.auth.outputs.project_id }}
        run: |
          set -euo pipefail
          gcloud config set project "$PROJECT" --quiet
          gcloud services enable cloudfunctions.googleapis.com cloudbuild.googleapis.com artifactregistry.googleapis.com \
            run.googleapis.com eventarc.googleapis.com pubsub.googleapis.com secretmanager.googleapis.com compute.googleapis.com --quiet
          # New Google Cloud projects no longer let the default build account build functions; give it the role it needs.
          NUM=$(gcloud projects describe "$PROJECT" --format='value(projectNumber)')
          gcloud projects add-iam-policy-binding "$PROJECT" --member="serviceAccount:${NUM}-compute@developer.gserviceaccount.com" \
            --role=roles/cloudbuild.builds.builder --condition=None --quiet > /dev/null \
            || echo "::warning::Couldn't give the build role to the compute service account. If the functions deploy fails with a build permission error, give ${NUM}-compute@developer.gserviceaccount.com the Cloud Build Service Account role."
      - name: Store the Anthropic key in Secret Manager
        env:
          PROJECT: ${{ steps.auth.outputs.project_id }}
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          fb() { npx -y "$FIREBASE_TOOLS" "$@" --project "$PROJECT" --non-interactive; }
          CUR=$(fb functions:secrets:access ANTHROPIC_API_KEY 2>/dev/null || true)
          if [ "$CUR" != "$KEY" ]; then
            F="$RUNNER_TEMP/anthropic.key"
            printf '%s' "$KEY" > "$F"
            fb functions:secrets:set ANTHROPIC_API_KEY --data-file "$F" --force
            rm -f "$F"
            echo "Anthropic key updated."
          else
            echo "Anthropic key unchanged."
          fi
      - name: Store the website's email sending address in Secret Manager
        env:
          PROJECT: ${{ steps.auth.outputs.project_id }}
          SMTP: ${{ secrets.SMTP_URL }}
        run: |
          set -euo pipefail
          fb() { npx -y "$FIREBASE_TOOLS" "$@" --project "$PROJECT" --non-interactive; }
          WANT="${SMTP:-none}"
          CUR=$(fb functions:secrets:access SMTP_URL 2>/dev/null || true)
          if [ "$CUR" != "$WANT" ]; then
            F="$RUNNER_TEMP/smtp.url"
            printf '%s' "$WANT" > "$F"
            fb functions:secrets:set SMTP_URL --data-file "$F" --force
            rm -f "$F"
            [ "$WANT" = "none" ] && echo "No SMTP_URL secret: website requests are stored but not emailed." || echo "Website email updated."
          else
            echo "Website email unchanged."
          fi
      - name: Make the key pair for phone notifications (once)
        env:
          PROJECT: ${{ steps.auth.outputs.project_id }}
        run: |
          set -euo pipefail
          fb() { npx -y "$FIREBASE_TOOLS" "$@" --project "$PROJECT" --non-interactive; }
          # Made once and kept: a new pair would cut off every phone that turned notifications on.
          if fb functions:secrets:access WEBPUSH_KEYS > /dev/null 2>&1; then
            echo "Notification keys already there."
          else
            F="$RUNNER_TEMP/webpush.json"
            node -e "process.stdout.write(JSON.stringify(require('./functions/node_modules/web-push').generateVAPIDKeys()))" > "$F"
            fb functions:secrets:set WEBPUSH_KEYS --data-file "$F" --force
            rm -f "$F"
            echo "Notification keys made."
          fi
      - name: Deploy rules and functions
        env:
          PROJECT: ${{ steps.auth.outputs.project_id }}
        run: npx -y "$FIREBASE_TOOLS" deploy --only firestore,storage,functions --project "$PROJECT" --non-interactive --force
      - name: Publish the notification key for the app
        env:
          PROJECT: ${{ steps.auth.outputs.project_id }}
        run: |
          set -euo pipefail
          npx -y "$FIREBASE_TOOLS" functions:secrets:access WEBPUSH_KEYS --project "$PROJECT" --non-interactive | node functions/scripts/set-push-key.cjs
      - name: Move AI speed and cost out of older damage checks (only the app creator sees them)
        env:
          PROJECT: ${{ steps.auth.outputs.project_id }}
        run: node functions/scripts/move-usage.cjs
      - name: Move van costs out of the records managers read (only owners see costs)
        env:
          PROJECT: ${{ steps.auth.outputs.project_id }}
        run: node functions/scripts/move-costs.cjs
      - name: Move companies to the Fast model once (the default since 2026-10-25)
        env:
          PROJECT: ${{ steps.auth.outputs.project_id }}
        run: node functions/scripts/haiku-default.cjs
      - name: Set the app creator
        env:
          PROJECT: ${{ steps.auth.outputs.project_id }}
          # Change the list under Settings > Secrets and variables > Actions > Variables (comma separated), then run Deploy.
          APP_CREATOR_EMAILS: ${{ vars.APP_CREATOR_EMAILS || 'casian.colto@gmail.com' }}
        run: node functions/scripts/set-creators.cjs

  web:
    name: Web app
    # The app goes live only after the tests passed and the rules and functions it calls are deployed.
    needs: backend
    runs-on: ubuntu-24.04
    steps:
      - name: Check the secret is there
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          [ -n "$SA" ] || { echo "::error title=Missing secret::Add FIREBASE_SERVICE_ACCOUNT under Settings > Secrets and variables > Actions. See README, step 2."; exit 1; }
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build the web app
        run: npx expo export -p web --clear
      - uses: google-github-actions/auth@v3
        id: auth
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Deploy the web app to Firebase Hosting
        env:
          PROJECT: ${{ steps.auth.outputs.project_id }}
          SITE: ${{ vars.WEBSITE_SITE || 'fratius-web' }}
        run: |
          fb() { npx -y "$FIREBASE_TOOLS" "$@" --project "$PROJECT" --non-interactive; }
          # Two Hosting sites: the app (the project's default site) and the website for fratius.com.
          fb hosting:sites:get "$SITE" > /dev/null 2>&1 || fb hosting:sites:create "$SITE" \
            || { echo "::error title=Website::Couldn't create the Hosting site $SITE (the name may be taken by another Firebase project). Set the WEBSITE_SITE variable to another name and run Deploy again."; exit 1; }
          fb target:apply hosting app "$PROJECT"
          fb target:apply hosting website "$SITE"
          if ! fb deploy --only hosting:app; then
            echo "::error title=Hosting::Deploy failed. If it says it can't find the default site, open Hosting in the Firebase console, click Get started, then run this workflow again."
            exit 1
          fi
          echo "### Web app" >> "$GITHUB_STEP_SUMMARY"
          echo "https://$PROJECT.web.app" >> "$GITHUB_STEP_SUMMARY"
      - name: Deploy the website (fratius.com)
        env:
          PROJECT: ${{ steps.auth.outputs.project_id }}
          SITE: ${{ vars.WEBSITE_SITE || 'fratius-web' }}
        run: |
          fb() { npx -y "$FIREBASE_TOOLS" "$@" --project "$PROJECT" --non-interactive; }
          fb target:apply hosting website "$SITE"
          fb deploy --only hosting:website || { echo "::error title=Website::Deploy failed."; exit 1; }
          echo "### Website" >> "$GITHUB_STEP_SUMMARY"
          echo "https://$SITE.web.app (connect fratius.com in the Firebase console: Hosting > $SITE > Add custom domain)" >> "$GITHUB_STEP_SUMMARY"
          # The Impressum and privacy policy carry marked gaps until the company details are filled in.
          LEFT=$(grep -o 'class="todo"' website/*.html | wc -l)
          if [ "$LEFT" -gt 0 ]; then
            echo "::warning title=Website::The Impressum and privacy policy still have $LEFT gaps for company details (marked red). Fill them before connecting fratius.com."
            echo "**$LEFT gaps for company details left in the Impressum and privacy policy.**" >> "$GITHUB_STEP_SUMMARY"
          fi

  phone:
    name: Phone app (Expo Go)
    # The app goes live only after the tests passed and the rules and functions it calls are deployed.
    needs: backend
    runs-on: ubuntu-24.04
    steps:
      - name: Check the secret is there
        id: token
        env:
          T: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$T" ]; then
            echo "::warning title=Phone app not published::Add EXPO_TOKEN under Settings > Secrets and variables > Actions (create it at https://expo.dev/settings/access-tokens), then run Deploy again."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.token.outputs.ok == 'true'
      - uses: actions/setup-node@v7
        if: steps.token.outputs.ok == 'true'
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: steps.token.outputs.ok == 'true'
      - uses: expo/expo-github-action@v8
        if: steps.token.outputs.ok == 'true'
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Publish the update
        if: steps.token.outputs.ok == 'true'
        env:
          MSG: ${{ github.event.head_commit.message || 'Manual deploy' }}
        run: |
          set -euo pipefail
          eas update --clear-cache --channel main --platform all --environment production --non-interactive --json \
            --message "$(printf '%s' "$MSG" | head -n1 | cut -c1-100)" > "$RUNNER_TEMP/update.json"
          PID=$(jq -r '.expo.extra.eas.projectId' app.json)
          GROUP=$(jq -r '.[0].group' "$RUNNER_TEMP/update.json")
          RUNTIME=$(jq -r '.[0].runtimeVersion' "$RUNNER_TEMP/update.json")
          LATEST="https://qr.expo.dev/eas-update?projectId=$PID&runtimeVersion=$RUNTIME&channel=main"
          THIS="https://qr.expo.dev/eas-update?projectId=$PID&groupId=$GROUP"
          echo "::notice title=Phone app published::runtime $RUNTIME, update group $GROUP. QR for the latest version: $LATEST"
          {
            echo "### Phone app"
            echo "Scan with the iPhone camera (or in Expo Go on Android). Expo Go must be installed and up to date."
            echo ""
            echo "| Always the latest version | This version only |"
            echo "|---|---|"
            echo "| ![latest]($LATEST) | ![this]($THIS) |"
            echo ""
            echo "Update page: https://expo.dev/projects/$PID/updates/$GROUP"
          } >> "$GITHUB_STEP_SUMMARY"
