# Checks a branch before it goes to main: access rules on the Firestore emulator, then type checks.
name: Test

on:
  push:
    branches-ignore: [main, 'diag/**', diag-results]
  workflow_dispatch:

env:
  FIREBASE_TOOLS: firebase-tools@15.33.0

jobs:
  rules:
    name: Access rules
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --prefix tests
      - name: Run the rules tests on the Firestore emulator
        run: npx -y "$FIREBASE_TOOLS" emulators:exec --only firestore --project demo-fleet "npm --prefix tests test" 2>&1 | tee rules.log
      - name: Show failures
        if: always()
        run: |
          grep -E "^not ok|# (pass|fail)" rules.log | while read -r l; do echo "::notice title=Rules::$l"; done || true

  types:
    name: Type checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci && npm ci --prefix functions
      - run: npm run typecheck
