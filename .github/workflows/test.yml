# Checks a branch before it goes to main: access rules on the Firestore emulator, van history end to end on the
# emulators, then type checks.
name: Test

on:
  push:
    branches-ignore: [main, 'diag/**', diag-results]
  workflow_dispatch:

env:
  FIREBASE_TOOLS: firebase-tools@15.33.0

jobs:
  rules:
    name: Access rules
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --prefix tests
      - name: Run the rules tests on the Firestore emulator
        shell: bash
        run: npx -y "$FIREBASE_TOOLS" emulators:exec --only firestore --project demo-fleet "npm --prefix tests test" 2>&1 | tee rules.log
      - name: Show failures
        if: always()
        run: |
          grep -E "^not ok|# (pass|fail)" rules.log | while read -r l; do echo "::notice title=Rules::$l"; done || true
          grep -E -A 12 "^\s+not ok" rules.log | grep -E "not ok|error|Error|expected|actual|message" | head -30 | while read -r l; do echo "::notice title=Rules detail::$l"; done || true

  history:
    name: Van history, end to end
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --prefix tests && npm ci --prefix functions && npm --prefix functions run build
      - name: Assignments, pick-up photos and history on the emulators (sign-in, rules, functions, storage)
        shell: bash
        run: |
          echo "ANTHROPIC_API_KEY=not-used-in-tests" > functions/.secret.local
          # A throwaway key pair for the notification test (the test reads it back to check the signature).
          echo "WEBPUSH_KEYS='$(node -e "process.stdout.write(JSON.stringify(require('./functions/node_modules/web-push').generateVAPIDKeys()))")'" >> functions/.secret.local
          echo "SMTP_URL=none" >> functions/.secret.local
          npx -y "$FIREBASE_TOOLS" emulators:exec --only auth,firestore,functions,storage --project demo-fleet-check "npm --prefix tests run history" 2>&1 | tee history.log
      - name: Show failures
        if: always()
        run: |
          grep -E "^not ok|# (pass|fail)" history.log | while read -r l; do echo "::notice title=History::$l"; done || true
          grep -E -A 14 "^\s*not ok" history.log | grep -E "error|Error|code|expected|actual|failureType|message|at " | head -30 | while read -r l; do echo "::notice title=History detail::$l"; done || true
          # The first failure in full (the GitHub log itself isn't always reachable).
          # (GitHub keeps 10 notes of each kind per step: warnings and errors carry these.)
          grep -m1 -E -A 30 "^\s*not ok" history.log | grep -vE "^\s*$|duration_ms|^\s*---|^\s*\.\.\." | head -10 | while read -r l; do echo "::warning title=First failure::$l"; done || true
          grep -E "Error|error:|failed to load|Failed to load" history.log | grep -v "not ok" | head -10 | while read -r l; do echo "::error title=Emulator::$l"; done || true

  types:
    name: Type checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci && npm ci --prefix functions
      - run: npm run typecheck
      - name: Translations (no lost or invented placeholders)
        run: node scripts/i18n.mjs --strict
      - name: Website translations (every text, no lost or invented placeholders)
        run: node scripts/site-i18n.mjs --strict
