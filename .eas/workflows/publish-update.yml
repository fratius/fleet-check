# Publishes the phone app to Expo Go on every push to main.
# Runs on Expo's servers through the GitHub connection on expo.dev, so no Expo token is needed.
# Open it on a phone with the QR code for the "main" channel (see README, step 5).
name: Publish to Expo Go

on:
  push:
    branches: ['main']

jobs:
  publish:
    name: Publish update
    type: update
    environment: production
    params:
      channel: main
      platform: all
